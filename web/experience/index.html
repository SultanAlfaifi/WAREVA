<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WAREVA · غرفة التحكم</title>
  <meta name="description" content="غرفة تحكم واريفا: احقن خللًا في الوحدة الافتراضية وراقب متحكم الأمان يقرر، والتنبيه يصل إلى الجوال.">
  <meta name="theme-color" content="#08121a">
  <link rel="icon" href="../../brand/logos/wareva-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../src/site.css">
  <link rel="stylesheet" href="../src/experience.css">
  <script type="module" src="../src/experience.js"></script>
</head>
<body class="site xp" data-control>
  <header class="xp__bar">
    <a href="../" class="nav__brand" aria-label="WAREVA · واريفا"><img src="../../brand/logos/wareva-lockup-white.svg" alt="WAREVA · واريفا" width="123" height="32"></a>
    <span class="xp__title" data-i18n="cr.k">غرفة التحكم الحية</span>
    <button class="nav__lang" type="button" data-lang-toggle data-i18n="nav.lang">English</button>
  </header>
  <main class="xp__main">
    <div class="xp__unit">
      <div class="stage stage--control" data-stage><p class="stage__fallback" data-i18n="stage.no3d"></p></div>
      <div class="stage__tools">
        <span class="stage__hint" data-i18n="cr.drag">اسحب لتدوير الوحدة</span>
        <span class="stage__zoom">
          <button type="button" data-zoom="1.2" aria-label="تقريب">+</button>
          <button type="button" data-zoom="-1.2" aria-label="تبعيد">−</button>
        </span>
      </div>
    </div>
    <aside class="xp__side">
      <div class="phone" data-phone></div>
      <div class="xp__controls">
        <p class="control__label" data-i18n="cr.faults">اختر حالة</p>
        <div class="chips" data-faults></div>
        <div class="control__row">
          <div class="seg" role="radiogroup" aria-label="سرعة المحاكاة" data-speed>
            <button type="button" role="radio" aria-checked="true" data-speed-value="1">×1</button>
            <button type="button" role="radio" aria-checked="false" data-speed-value="10">×10</button>
            <button type="button" role="radio" aria-checked="false" data-speed-value="60">×60</button>
          </div>
          <button type="button" class="btn btn--small" data-reset disabled data-i18n="cr.reset">إعادة الضبط بعد الفحص</button>
        </div>
      </div>
    </aside>
  </main>
</body>
</html>
